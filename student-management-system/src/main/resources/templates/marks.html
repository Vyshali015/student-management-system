<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Marks Report</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 15px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#2c3e50;color:#fff}a.btn,button{background:#2c3e50;color:#fff;padding:6px 12px;text-decoration:none;border:none;border-radius:4px;cursor:pointer}a.del{background:#c0392b}input{padding:6px;margin:4px 0}</style></head>
<body>
<h1>Report: <span th:text="${student.name}"></span></h1>
<p>Course: <b th:text="${student.course}"></b> | Email: <span th:text="${student.email}"></span></p>

<form th:action="@{/students/{id}/marks(id=${student.id})}" method="post">
    <input type="text" name="subject" placeholder="Subject" required>
    <input type="number" name="score" placeholder="Score (0-100)" min="0" max="100" step="0.01" required>
    <button type="submit">Add Mark</button>
</form>

<table>
    <tr><th>Subject</th><th>Score</th><th>Action</th></tr>
    <tr th:each="m : ${student.marks}">
        <td th:text="${m.subject}"></td>
        <td th:text="${m.score}"></td>
        <td><a class="btn del" th:href="@{/students/{id}/marks/delete/{mid}(id=${student.id},mid=${m.id})}">Remove</a></td>
    </tr>
</table>

<h3>Total: <span th:text="${student.total}"></span> |
    Average: <span th:text="${#numbers.formatDecimal(student.average,1,2)}"></span> |
    Grade: <span th:text="${student.grade}"></span></h3>
<a class="btn" th:href="@{/students}">Back</a> <button onclick="window.print()">Print Report</button>
</body>
</html>
