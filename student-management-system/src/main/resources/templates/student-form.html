<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Student Form</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 15px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#2c3e50;color:#fff}a.btn,button{background:#2c3e50;color:#fff;padding:6px 12px;text-decoration:none;border:none;border-radius:4px;cursor:pointer}a.del{background:#c0392b}input{padding:6px;margin:4px 0}</style></head>
<body>
<h1 th:text="${student.id == null} ? 'Add Student' : 'Edit Student'"></h1>
<form th:action="@{/students/save}" th:object="${student}" method="post">
    <input type="hidden" th:field="*{id}">
    <div>Name:<br><input type="text" th:field="*{name}" required></div>
    <div>Email:<br><input type="email" th:field="*{email}" required></div>
    <div>Course:<br><input type="text" th:field="*{course}" required></div>
    <br>
    <button type="submit">Save</button>
    <a class="btn" th:href="@{/students}">Cancel</a>
</form>
</body>
</html>
