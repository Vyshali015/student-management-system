<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Students</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 15px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#2c3e50;color:#fff}a.btn,button{background:#2c3e50;color:#fff;padding:6px 12px;text-decoration:none;border:none;border-radius:4px;cursor:pointer}a.del{background:#c0392b}input{padding:6px;margin:4px 0}</style></head>
<body>
<h1>Student Management System</h1>
<form th:action="@{/students}" method="get">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name">
    <button type="submit">Search</button>
    <a class="btn" th:href="@{/students/new}">+ Add Student</a>
</form>
<table>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Average</th><th>Grade</th><th>Actions</th></tr>
    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.email}"></td>
        <td th:text="${s.course}"></td>
        <td th:text="${#numbers.formatDecimal(s.average,1,2)}"></td>
        <td th:text="${s.grade}"></td>
        <td>
            <a class="btn" th:href="@{/students/{id}/marks(id=${s.id})}">Marks/Report</a>
            <a class="btn" th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a>
            <a class="btn del" th:href="@{/students/delete/{id}(id=${s.id})}" onclick="return confirm('Delete this student?')">Delete</a>
        </td>
    </tr>
</table>
</body>
</html>
